[project]
name = "qtfolio-backend"
version = "0.1.0"
description = "qtfolio backend: local portfolio terminal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2.55,<0.3",
    "pyxirr>=0.10",
    "python-multipart>=0.0.18",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
